
name: Ludora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-source

permissions:
  contents: read

jobs:
  build:
    name: Build NativeScript Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout NativeScript source
        uses: actions/checkout@v4
        with:
          ref: native-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose environment
        run: |
          set -eux
          echo "PATH=$PATH"
          command -v node
          command -v npm
          command -v java
          node --version
          npm --version
          java -version

      - name: Install project dependencies
        run: npm ci

      - name: Install NativeScript CLI locally
        run: npm install --no-save nativescript@9.1.2

      - name: Verify NativeScript CLI
        run: |
          set -eux
          test -x node_modules/.bin/ns
          ./node_modules/.bin/ns --version

      - name: Add Android platform
        run: |
          set -eux
          ./node_modules/.bin/ns platform add android@9.1.1

      - name: Build Android APK
        run: |
          set -eux
          ./node_modules/.bin/ns build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludora-android-apk
          path: platforms/android/**/*.apk
          if-no-files-found: error
          retention-days: 7
