
name: Ludora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-source

permissions:
  contents: read

jobs:
  build:
    name: Build NativeScript Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout NativeScript source
        uses: actions/checkout@v4
        with:
          ref: native-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
          yes | sdkmanager --licenses

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version
          sdkmanager --list_installed

      - name: Install project dependencies
        run: npm ci

      - name: Install NativeScript CLI
        run: npm install --global nativescript@9.1.2

      - name: Verify NativeScript CLI
        run: ns --version

      - name: Add Android platform
        run: ns platform add android@9.1.1

      - name: Build Android APK
        run: ns build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludora-android-apk
          path: platforms/android/**/*.apk
          if-no-files-found: error
          retention-days: 7
